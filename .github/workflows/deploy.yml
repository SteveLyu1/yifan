name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/img/prof_pic.jpg"
      - "assets/img/portrait_20261024.webp.b64"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare static homepage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets/img
          cp index.html _site/index.html
          cp assets/img/prof_pic.jpg _site/assets/img/prof_pic.jpg
          base64 --decode assets/img/portrait_20261024.webp.b64 > _site/assets/img/portrait_20261024.webp
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q 'Curious about why models behave' _site/index.html
          test -s _site/assets/img/prof_pic.jpg
          test -s _site/assets/img/portrait_20261024.webp
          echo "Homepage and portrait ready for deployment."

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
